<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" />
<meta name="color-scheme" content="light only" />
<title>404 · AI Magazine</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="페이지를 찾지 못했습니다. 서가로 돌아가 다른 책을 펼쳐보세요." />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="styles/site.css?v=31" />
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<style>
  .nf-wrap {
    max-width: var(--shell-max);
    margin: 0 auto;
    padding: clamp(80px, 16vh, 160px) var(--shell-pad) 96px;
    text-align: center;
  }
  .nf-code {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(72px, 14vw, 160px);
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
  }
  .nf-rule {
    width: 48px; height: 4px;
    background: var(--brand);
    margin: 24px auto;
  }
  .nf-msg {
    font-size: 18px;
    color: var(--ink-soft);
    text-wrap: balance;
    margin-bottom: 40px;
  }
  .nf-home {
    display: inline-block;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--navy);
    text-decoration: none;
    border-radius: 6px;
    transition: background 0.3s var(--ease-fluid), transform 0.3s var(--ease-fluid);
  }
  .nf-home:hover { background: var(--brand); }
  .nf-home:active { transform: translateY(1px) scale(0.98); }
  .nf-home:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
</style>
</head><body class="portal">

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="logo" href="./">AI <em>Magazine</em></a>
    <div class="nav-right">Magazine</div>
  </div>
</nav>

<main class="nf-wrap">
  <div class="nf-code">404</div>
  <div class="nf-rule"></div>
  <p class="nf-msg">찾으시는 페이지가 서가에 없습니다.<br/>책장이 정리되며 자리가 바뀌었을 수 있어요.</p>
  <a class="nf-home" href="./">서가로 돌아가기</a>
</main>

<footer class="site-foot">
  <span>AI × <b>Series</b> · Magazine</span>
  <span>Pretendard typeface</span>
</footer>

</body></html>
