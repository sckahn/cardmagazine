<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><title>망분리 가이드 · Cover</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-style:normal !important;}
  html,body{width:1080px;height:1080px;overflow:hidden;}
  body{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    background:linear-gradient(160deg, #EAF4FB 0%, #F5FAFD 50%, #FFFFFF 100%);
    color:#0F2742;
    letter-spacing:-0.022em;
    word-break:keep-all;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(15,39,66,0.025) 1px, transparent 1px);background-size:5px 5px;pointer-events:none;}
  .corner{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(60px);opacity:0.5;}
  .c1{top:-100px;right:-80px;background:#7DB7E8;}
  .c2{bottom:-80px;left:-100px;background:#A6DBC6;}

  .stage{position:relative;width:1080px;height:1080px;padding:88px 90px;display:flex;flex-direction:column;justify-content:space-between;}

  .top{display:flex;align-items:center;justify-content:space-between;}
  .badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,255,255,0.85);border:1px solid #BFD9EE;border-radius:999px;font-size:13px;font-weight:600;color:#0F4C81;backdrop-filter:blur(8px);}
  .dot{width:8px;height:8px;border-radius:50%;background:#2E86C1;box-shadow:0 0 0 4px rgba(46,134,193,0.18);}
  .meta{font-size:12px;font-weight:500;color:#5A7693;letter-spacing:0.06em;}

  .center{display:flex;flex-direction:column;gap:28px;}
  .kicker{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700;color:#2E86C1;letter-spacing:0.08em;text-transform:uppercase;}
  .kicker .line{width:60px;height:1px;background:#2E86C1;}

  .hero{font-size:96px;font-weight:800;line-height:1.04;letter-spacing:-0.034em;color:#0F2742;}
  .hero em{font-style:normal !important;color:#2E86C1;font-weight:800;position:relative;display:inline-block;}
  .hero em::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:14px;background:rgba(125,183,232,0.32);z-index:-1;}

  .sub{font-size:22px;font-weight:500;line-height:1.55;color:#3C5878;max-width:780px;margin-top:6px;}
  .sub b{color:#0F4C81;font-weight:700;}

  .illust{position:absolute;right:90px;top:280px;}

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;}
  .tag-row{display:flex;gap:10px;flex-wrap:wrap;}
  .tag{padding:8px 14px;background:#FFFFFF;border:1px solid #DCE9F4;border-radius:8px;font-size:13px;font-weight:600;color:#3C5878;}
  .pageno{font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;color:#5A7693;letter-spacing:0.05em;}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="corner c1"></div>
  <div class="corner c2"></div>

  <div class="stage">
    <div class="top">
      <div class="badge"><span class="dot"></span> 금융망분리 가이드</div>
      <div class="meta">FOR FINANCIAL PROFESSIONALS · 2026</div>
    </div>

    <div class="center">
      <div class="kicker"><span class="line"></span> 한 번쯤 궁금했던 그 질문</div>
      <h1 class="hero">
        외부 AI한테<br/>
        회사 문서<br/>
        <em>보내도 돼요?</em>
      </h1>
      <p class="sub">
        결론부터 말하면 — <b>안 됩니다</b>. 개인정보를 지웠어도요.<br/>
        왜 그런지, 그럼 어떻게 일해야 하는지 함께 살펴봅니다.
      </p>
    </div>

    <!-- 일러스트 -->
    <svg class="illust" width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7DB7E8"/>
          <stop offset="100%" stop-color="#2E86C1"/>
        </linearGradient>
      </defs>
      <!-- 노트북 -->
      <rect x="40" y="80" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#2E86C1" stroke-width="2.5"/>
      <rect x="50" y="90" width="140" height="78" rx="4" fill="#EAF4FB"/>
      <rect x="20" y="180" width="200" height="14" rx="4" fill="#FFFFFF" stroke="#2E86C1" stroke-width="2.5"/>
      <!-- AI 말풍선 -->
      <rect x="68" y="100" width="104" height="44" rx="8" fill="url(#g1)"/>
      <text x="120" y="128" font-family="Pretendard" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI</text>
      <!-- 자물쇠 -->
      <circle cx="200" cy="46" r="28" fill="#FFB84D"/>
      <rect x="190" y="42" width="20" height="16" rx="3" fill="#0F2742"/>
      <path d="M194 42 V36 a6 6 0 0 1 12 0 V42" fill="none" stroke="#0F2742" stroke-width="3"/>
      <circle cx="200" cy="50" r="2" fill="#FFB84D"/>
    </svg>

    <div class="bottom">
      <div class="tag-row">
        <span class="tag">#망분리</span>
        <span class="tag">#전자금융거래법</span>
        <span class="tag">#외부AI</span>
        <span class="tag">#사내자료보호</span>
      </div>
      <div class="pageno">01 / 08</div>
    </div>
  </div>
</body></html>
